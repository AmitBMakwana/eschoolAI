services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: schoolos-app:latest
    container_name: schoolos_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - schoolos-network
    depends_on:
      - mysql
      - redis
      - qdrant

  webserver:
    image: nginx:alpine
    container_name: schoolos_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - schoolos-network
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: schoolos_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-schoolos}
      MYSQL_USER: ${DB_USERNAME:-schoolos}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - schoolos-network

  redis:
    image: redis:7.2-alpine
    container_name: schoolos_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - schoolos-network

  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: schoolos_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - schoolos-network

networks:
  schoolos-network:
    driver: bridge

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
  qdrant-data:
    driver: local
